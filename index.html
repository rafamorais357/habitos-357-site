<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HÁBITOS 3.5.7</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>HÁBITOS 3.5.7</h1>
    <p>3 hábitos | 5 minutos | 7 dias</p>

    <div id="day-selector">
      <label for="day">Dia:</label>
      <select id="day" onchange="loadDay()">
        <!-- Dias de 1 a 7 -->
      </select>
    </div>

    <ul id="tasks">
      <li><input type="checkbox" id="walk"> <label for="walk">Caminhada</label></li>
      <li><input type="checkbox" id="read"> <label for="read">Leitura</label></li>
      <li><input type="checkbox" id="meditate"> <label for="meditate">Meditação</label></li>
    </ul>

    <button onclick="resetProgress()">Resetar Progresso</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
